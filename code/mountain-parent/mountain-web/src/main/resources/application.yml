mybatis-plus:
  mapper-locations: classpath:mapper/*Mapper.xml
  type-aliases-package: com.mountain.**.pojo.po
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted #全局逻辑删除字段
      logic-not-delete-value: "0" #全局逻辑未删除值
      logic-delete-value: "UNIX_TIMESTAMP()" #全局逻辑删除值，时间戳函数，精确到毫秒

mountain:
  auth:
    # 加密秘钥过期时间（分钟）
    key-expire: 1440
    # JWT签名密钥
    jwt-salt: 16085#4$46-aab4-*^4c99-b03c-17dc43ae1678
    # 无需授权即可访问的url
    permit-urls:
#      - /internal/**
      - /login

redis:
  cache-prefix: "mountain:"
  default-expire-time: 1800
  enable-two-level-cache: true
  cache:
    configuration:
      user:cache: 86400
      dept:cache: 86400
  redisson:
    enabled: true
    watchdog-timeout: 30000
    mode: single
    single:
      address: "redis://r-bp1psylw2prl6vl38npd.redis.rds.aliyuncs.com:6379"
